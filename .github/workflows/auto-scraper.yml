name: Auto Aggregate Only

on:
  schedule:
    # 每天執行兩次統計 (UTC時間 02:00 和 14:00)
    - cron: '0 2,14 * * *'
  workflow_dispatch:

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create Firebase Key File
        run: |
          echo '${{ secrets.FIREBASE_KEY_JSON }}' > firebase-key.json

      - name: Build
        working-directory: ./stock-fetcher
        run: dotnet build

      - name: Run Aggregation Only
        working-directory: ./stock-fetcher
        run: dotnet run -- aggregate