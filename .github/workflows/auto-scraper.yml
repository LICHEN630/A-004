steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Setup .NET
  uses: actions/setup-dotnet@v4
  with:
    dotnet-version: '8.0.x'

- name: Create Firebase Key File
  run: |
    echo '${{ secrets.FIREBASE_KEY_JSON }}' > firebase-key.json

- name: Build
  run: dotnet build

- name: Run Aggregation Only
  # 關鍵修改：只傳入 aggregate 參數，不執行爬蟲任務
  run: dotnet run -- aggregate